<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1150" viewBox="0 0 1400 1150" role="img" aria-labelledby="title desc">
<title id="title">Tideward physical tank setup: USB webcam, manually powered pump and measured trial layout</title>
<desc id="desc">Planned, illustrative setup. A fixed dry USB webcam connects by one data cable to a dry laptop. A submerged pump recirculates freshwater from its intake grille through outlet tubing to a submerged sidewall return in the same bin. Original AC power remains separate and manually operated. Sources, protected polygon, mesh collector and seven calibration marks must be physically measured. No Arduino, ESP32, relay, coral prop or three-dimensional print is required.</desc>
