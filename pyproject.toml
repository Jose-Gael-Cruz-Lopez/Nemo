[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reeftrace"
version = "0.3.0"
description = "Controlled source-intelligence proof of concept for floating debris"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "pyserial>=3.5,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "fastapi>=0.143.3,<1.0",
  "starlette>=1.8,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "numpy>=2.0,<3.0",
  "scipy>=1.14,<2.0",
  "opencv-python-headless>=4.10,<5.0",
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
sponsors = ["photonhq-api==0.5.0"]
evaluations = []
photon = ["photonhq-api==0.5.0"]
marine = ["copernicusmarine>=2.5,<3", "xarray>=2024.1", "h5netcdf[h5py]>=1.3"]
ocean = ["xarray>=2025.1", "netcdf4>=1.7", "copernicusmarine>=2.0,<3.0"]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "adapters*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
